<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="page page-narrow">
    <section class="card login-card">
        <span class="eyebrow">Acceso seguro</span>
        <h1>Iniciar sesión</h1>
        <p class="lede">Ingresa con tu cuenta de la tienda para continuar.</p>

        <div th:if="${param.error}" class="alert alert-error">
            Usuario o contraseña incorrectos
        </div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input id="username" type="text" name="username" placeholder="Ej. cliente" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input id="password" type="password" name="password" placeholder="••••••••" required>
            </div>
            <button class="btn" type="submit">Entrar</button>
        </form>
    </section>
    <p class="page-footnote">Usuarios de prueba: admin · vendedor · cliente</p>
</main>
</body>
</html>
