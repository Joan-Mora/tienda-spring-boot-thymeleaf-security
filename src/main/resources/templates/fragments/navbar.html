<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar">
    <a class="brand" th:href="@{/}">
        <span class="brand-mark">TD</span>
        <span>Tienda</span>
    </a>

    <div class="nav-links">
        <a th:href="@{/}">Inicio</a>
        <a sec:authorize="isAuthenticated()" th:href="@{/productos}">Productos</a>
        <a sec:authorize="hasAnyRole('CLIENTE','ADMIN')" th:href="@{/cliente}">Cliente</a>
        <a sec:authorize="hasAnyRole('VENDEDOR','ADMIN')" th:href="@{/vendedor}">Vendedor</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Admin</a>
    </div>

    <div class="navbar-actions">
        <a class="btn btn-secondary btn-sm" sec:authorize="isAnonymous()" th:href="@{/login}">Iniciar sesión</a>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post">
            <span class="user-chip">
                <span class="user-dot"></span>
                <span sec:authentication="name">usuario</span>
            </span>
            <button class="btn btn-secondary btn-sm" type="submit">Salir</button>
        </form>
    </div>
</nav>
</body>
</html>
