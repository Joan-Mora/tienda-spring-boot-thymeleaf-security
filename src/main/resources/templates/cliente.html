<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Panel del cliente')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="page">
    <section class="card">
        <span class="badge">CLIENTE</span>
        <h1>Panel del cliente</h1>
        <p>Hola, <span sec:authentication="name">usuario</span>. Aquí puedes consultar tu espacio de cliente.</p>
        <div class="meta">
            <span>Acceso permitido para roles: CLIENTE y ADMIN.</span>
        </div>
    </section>
</main>
</body>
</html>
