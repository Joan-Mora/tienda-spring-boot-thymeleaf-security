<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Panel de administración')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="page">
    <section class="card">
        <div class="panel-kicker">
            <span class="badge">Admin</span>
            <span class="badge badge-muted">Acceso total</span>
        </div>
        <h1 class="panel-title">Panel de administración</h1>
        <p class="lede">
            Hola, <strong sec:authentication="name">usuario</strong>.
            Tienes acceso completo a paneles y al catálogo de la tienda.
        </p>
        <div class="stat-row">
            <div class="stat">
                <span class="stat-label">Rol activo</span>
                <span class="stat-value">ADMIN</span>
            </div>
            <div class="stat">
                <span class="stat-label">Alcance</span>
                <span class="stat-value">Global</span>
            </div>
        </div>
        <div class="actions">
            <a class="btn" th:href="@{/productos}">Catálogo</a>
            <a class="btn btn-secondary" th:href="@{/cliente}">Panel cliente</a>
            <a class="btn btn-secondary" th:href="@{/vendedor}">Panel vendedor</a>
        </div>
    </section>
</main>
</body>
</html>
