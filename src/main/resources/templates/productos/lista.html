<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Productos')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="page page-wide">
    <section class="card">
        <div class="toolbar">
            <div>
                <h1>Catálogo de productos</h1>
                <p>Consulta, búsqueda y gestión según tu rol.</p>
            </div>
            <a class="btn"
               sec:authorize="hasAnyRole('VENDEDOR','ADMIN')"
               th:href="@{/productos/nuevo}">+ Nuevo producto</a>
        </div>

        <p th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}">Mensaje</p>

        <form class="search-form" th:action="@{/productos}" method="get">
            <input type="text" name="nombre" th:value="${nombre}" placeholder="Buscar por nombre">
            <button class="btn" type="submit">Buscar</button>
            <a class="btn btn-secondary" th:href="@{/productos}">Limpiar</a>
        </form>

        <div class="table-wrap">
            <table class="data-table">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p, estado : ${productos}">
                    <td th:text="${estado.count}">1</td>
                    <td th:text="${p.nombre}">Nombre</td>
                    <td th:text="${p.categoria}">Categoría</td>
                    <td th:text="${#numbers.formatDecimal(p.precio, 1, 'POINT', 0, 'COMMA')}">0</td>
                    <td th:text="${p.stock}" th:classappend="${p.stock < 5} ? 'bajo'">0</td>
                    <td class="actions-cell">
                        <a th:href="@{/productos/{id}(id=${p.id})}">Ver</a>
                        <span sec:authorize="hasAnyRole('VENDEDOR','ADMIN')">
                            |
                            <a th:href="@{/productos/{id}/editar(id=${p.id})}">Editar</a>
                            |
                            <form th:action="@{/productos/{id}/eliminar(id=${p.id})}" method="post" class="inline-form">
                                <button class="link-button danger" type="submit">Eliminar</button>
                            </form>
                        </span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(productos)}">
                    <td colspan="6">No hay productos para mostrar.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
