<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Detalle de producto')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="page">
    <section class="card">
        <div class="panel-kicker">
            <span class="badge" th:text="${producto.categoria}">Categoría</span>
            <span class="badge badge-danger" th:if="${producto.stock == 0}">Agotado</span>
            <span class="badge badge-warn" th:if="${producto.stock &gt; 0 and producto.stock &lt; 5}">Stock bajo</span>
        </div>
        <h1 th:text="${producto.nombre}">Nombre</h1>
        <p class="lede" th:text="${producto.descripcion}">Descripción</p>

        <div class="detail-grid">
            <div class="detail-item">
                <span class="label">Categoría</span>
                <span class="value" th:text="${producto.categoria}">—</span>
            </div>
            <div class="detail-item">
                <span class="label">Precio</span>
                <span class="value"
                      th:text="${'$' + #numbers.formatDecimal(producto.precio, 1, 'POINT', 0, 'COMMA')}">$0</span>
            </div>
            <div class="detail-item">
                <span class="label">Stock</span>
                <span class="value"
                      th:classappend="${producto.stock &lt; 5} ? ' bajo'"
                      th:text="${producto.stock}">0</span>
            </div>
        </div>

        <p th:if="${producto.stock == 0}" class="alert alert-error">Producto agotado</p>

        <div class="actions">
            <a class="btn btn-secondary" th:href="@{/productos}">Volver al listado</a>
            <a class="btn"
               sec:authorize="hasAnyRole('VENDEDOR','ADMIN')"
               th:href="@{/productos/{id}/editar(id=${producto.id})}">Editar</a>
        </div>
    </section>
</main>
</body>
</html>
