<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Detalle de producto')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="page">
    <section class="card">
        <span class="badge" th:text="${producto.categoria}">Categoría</span>
        <h1 th:text="${producto.nombre}">Nombre</h1>
        <p th:text="${producto.descripcion}">Descripción</p>

        <ul class="detail-list">
            <li>Categoría: <span th:text="${producto.categoria}"></span></li>
            <li>Precio: $<span th:text="${#numbers.formatDecimal(producto.precio, 1, 'POINT', 0, 'COMMA')}"></span></li>
            <li>Stock: <span th:text="${producto.stock}" th:classappend="${producto.stock < 5} ? 'bajo'"></span></li>
        </ul>

        <p th:if="${producto.stock == 0}" class="alert alert-error">Producto agotado</p>

        <div class="actions">
            <a class="btn btn-secondary" th:href="@{/productos}">Volver al listado</a>
            <a class="btn"
               sec:authorize="hasAnyRole('VENDEDOR','ADMIN')"
               th:href="@{/productos/{id}/editar(id=${producto.id})}">Editar</a>
        </div>
    </section>
</main>
</body>
</html>
