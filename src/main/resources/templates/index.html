<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Tienda')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="page">
    <section class="card">
        <h1>Bienvenido a la Tienda</h1>
        <p>Aplicación web con Thymeleaf y control de acceso por roles (ADMIN, VENDEDOR, CLIENTE).</p>
        <div class="actions" sec:authorize="isAnonymous()">
            <a class="btn" th:href="@{/login}">Iniciar sesión</a>
        </div>
        <div class="actions" sec:authorize="isAuthenticated()">
            <a class="btn" th:href="@{/redirigir}">Ir a mi panel</a>
        </div>
    </section>
</main>
</body>
</html>
