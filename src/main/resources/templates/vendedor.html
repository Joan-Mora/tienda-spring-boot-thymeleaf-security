<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Panel del vendedor')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
<main class="page">
    <section class="card">
        <div class="panel-kicker">
            <span class="badge">Vendedor</span>
            <span class="badge badge-muted">Gestión de catálogo</span>
        </div>
        <h1 class="panel-title">Panel del vendedor</h1>
        <p class="lede">
            Hola, <strong sec:authentication="name">usuario</strong>.
            Puedes crear, editar y eliminar productos del inventario.
        </p>
        <div class="stat-row">
            <div class="stat">
                <span class="stat-label">Rol activo</span>
                <span class="stat-value">VENDEDOR</span>
            </div>
            <div class="stat">
                <span class="stat-label">Permisos</span>
                <span class="stat-value">CRUD</span>
            </div>
        </div>
        <div class="actions">
            <a class="btn" th:href="@{/productos}">Gestionar productos</a>
            <a class="btn btn-secondary" th:href="@{/productos/nuevo}">Nuevo producto</a>
        </div>
    </section>
</main>
</body>
</html>
